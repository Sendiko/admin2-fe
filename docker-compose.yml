services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL:-http://192.168.18.10:8003/api}
    container_name: admin2-fe
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - API_URL=${API_URL:-http://192.168.18.10:8003/api}
      - PORT=3000
      - HOSTNAME=0.0.0.0
